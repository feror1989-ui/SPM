<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronómetro SPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF0; --panel:#FFFFFF; --ink:#16212B; --muted:#5B6A77;
  --go:#F2B705; --go-ink:#16212B; --stop:#C62828; --stop-ink:#FFFFFF; --line:#C9D1D8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171D; --panel:#1A242D; --ink:#EEF2F5; --muted:#93A3B1; --line:#2C3A46;
  }
}
:root[data-theme="dark"]{ --bg:#10171D; --panel:#1A242D; --ink:#EEF2F5; --muted:#93A3B1; --line:#2C3A46; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:480px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}

.result{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px 14px}
.result .spm{font-size:clamp(84px,30vw,140px);font-weight:700;line-height:.9;letter-spacing:-1px}
.result .unit{font-size:20px;color:var(--muted);margin-left:6px;font-weight:600}
.result .time{margin-top:10px;font-size:18px;color:var(--muted)}
.result .time b{color:var(--ink);font-weight:600}

.strokes{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px}
.strokes p{margin:0;font-size:15px;color:var(--muted);line-height:1.3}
.strokes p strong{color:var(--ink);display:block;font-size:16px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.stepper button{width:48px;height:48px;border:0;background:transparent;color:var(--ink);font-size:26px;cursor:pointer}
.stepper span{min-width:40px;text-align:center;font-size:28px;font-weight:700}

.big{
  width:100%; aspect-ratio:1/0.78; max-height:46vh; border:0; border-radius:28px;
  background:var(--go); color:var(--go-ink); cursor:pointer;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .06s, box-shadow .06s;
  user-select:none; touch-action:manipulation;
}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big .clock{font-size:64px;line-height:1}
.big small{font-family:"Barlow",sans-serif;font-weight:600;font-size:16px;opacity:.8}
.big.running{background:var(--stop);color:var(--stop-ink)}
.big:focus-visible,.stepper button:focus-visible,.link:focus-visible{outline:3px solid var(--muted);outline-offset:3px}

.hist{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.hist header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist h2{margin:0;font-size:17px}
.avg{font-size:15px;color:var(--muted)}
.avg b{color:var(--ink);font-size:20px}
.hist ol{list-style:none;margin:10px 0 0;padding:0}
.hist li{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:17px}
.hist li span:first-child{color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin:10px 0 0}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:15px;padding:8px 0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.big{transition:none}}

.apps{max-width:480px;margin:0 auto;padding:12px 16px 0;display:flex;gap:8px}
.apps a{flex:1;text-align:center;padding:9px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
.apps a[aria-current]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.apps a:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
</style>
</head>
<body>
<nav class="apps" aria-label="Herramientas">
  <a href="index.html" aria-current="page">Cronómetro SPM</a>
  <a href="pruebas/index.html">Pruebas de pozos</a>
</nav>
<main>
  <section class="result" aria-live="polite">
    <div><span class="spm num" id="spm">—</span><span class="unit">SPM</span></div>
    <div class="time" id="detail">Toca Iniciar al comenzar una carrera</div>
  </section>

  <div class="strokes">
    <p><strong>Golpes medidos</strong>SPM = 60 × golpes ÷ segundos</p>
    <div class="stepper">
      <button type="button" id="minus" aria-label="Menos golpes">−</button>
      <span class="num" id="n">1</span>
      <button type="button" id="plus" aria-label="Más golpes">+</button>
    </div>
  </div>

  <button type="button" class="big" id="btn">
    <span class="clock num" id="clock">0.00</span>
    <span id="label">Iniciar</span>
  </button>

  <section class="hist">
    <header>
      <h2>Mediciones</h2>
      <span class="avg" id="avg"></span>
    </header>
    <ol id="list"></ol>
    <p class="empty" id="empty">Aún no hay mediciones.</p>
    <button type="button" class="link" id="clear" hidden>Borrar mediciones</button>
  </section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const btn=$('btn'), clock=$('clock'), label=$('label'), spmEl=$('spm'), detail=$('detail');
  let running=false, t0=0, raf=0, strokes=1, wake=null;
  let hist=[];
  try{ hist = JSON.parse(localStorage.getItem('spm-hist')||'[]') || []; }catch(e){ hist=[]; }
  try{ const s=parseInt(localStorage.getItem('spm-n')); if(s>0) strokes=s; }catch(e){}
  $('n').textContent=strokes;

  const fmt = (x,d=2) => x.toFixed(d).replace('.',',');

  function tick(){
    clock.textContent = fmt((performance.now()-t0)/1000);
    raf = requestAnimationFrame(tick);
  }
  async function keepAwake(on){
    try{
      if(on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
      else if(!on && wake){ await wake.release(); wake=null; }
    }catch(e){}
  }

  btn.addEventListener('click', ()=>{
    if(!running){
      running=true; t0=performance.now();
      btn.classList.add('running'); label.textContent='Detener';
      detail.textContent='Midiendo ' + strokes + (strokes>1?' golpes…':' golpe…');
      keepAwake(true); tick();
    }else{
      running=false; cancelAnimationFrame(raf);
      const secs=(performance.now()-t0)/1000;
      clock.textContent=fmt(secs);
      btn.classList.remove('running'); label.textContent='Iniciar de nuevo';
      keepAwake(false);
      if(navigator.vibrate) navigator.vibrate(60);
      if(secs < 0.2){ detail.textContent='Tiempo muy corto. Inténtalo de nuevo.'; return; }
      const spm = 60*strokes/secs;
      spmEl.textContent = fmt(spm);
      detail.innerHTML = '<b>'+fmt(secs)+' s</b> para '+strokes+(strokes>1?' golpes':' golpe');
      hist.unshift({spm, secs, n:strokes, at:Date.now()});
      hist = hist.slice(0,20);
      save(); render();
    }
  });

  function setN(v){
    if(running) return;
    strokes=Math.max(1,Math.min(20,v)); $('n').textContent=strokes;
    try{ localStorage.setItem('spm-n',strokes); }catch(e){}
  }
  $('minus').onclick=()=>setN(strokes-1);
  $('plus').onclick=()=>setN(strokes+1);

  $('clear').onclick=()=>{
    if(!confirm('¿Borrar todas las mediciones?')) return;
    hist=[]; save(); render();
  };

  function save(){ try{ localStorage.setItem('spm-hist', JSON.stringify(hist)); }catch(e){} }
  function render(){
    const list=$('list'); list.innerHTML='';
    hist.forEach(h=>{
      const li=document.createElement('li');
      const d=new Date(h.at);
      const hhmm=d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
      li.innerHTML='<span>'+hhmm+' · '+fmt(h.secs)+' s'+(h.n>1?' / '+h.n+' g':'')+'</span><span class="num"><b>'+fmt(h.spm)+'</b> SPM</span>';
      list.appendChild(li);
    });
    $('empty').hidden = hist.length>0;
    $('clear').hidden = hist.length===0;
    if(hist.length>1){
      const avg=hist.reduce((a,h)=>a+h.spm,0)/hist.length;
      $('avg').innerHTML='Promedio <b class="num">'+fmt(avg)+'</b>';
    }else $('avg').textContent='';
  }
  render();
})();
</script>
</body>
</html>
